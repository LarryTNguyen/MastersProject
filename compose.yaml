name: serverless-trace-analyzer

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - trace-postgres-data:/var/lib/postgresql/data
      - ./trace_schema/schema.sql:/docker-entrypoint-initdb.d/001-trace-schema.sql:ro

volumes:
  trace-postgres-data:
