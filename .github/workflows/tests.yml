name: tests

# Runs every package's tests on each push to main and each pull request, against a
# throwaway PostgreSQL 16 with trace_schema/schema.sql applied (same as compose.yaml)
# and a headless Chromium for the dashboard's browser tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trace
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://trace:trace@localhost:55432/trace
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r trace_schema/requirements.txt -r reconstruction/requirements.txt \
                      -r dashboard/requirements.txt -r experiments/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Apply the schema
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f trace_schema/schema.sql

      - name: trace_schema checks
        run: |
          python trace_schema/check_schema.py
          python trace_schema/validate.py trace_schema/examples/parallel-trace.json trace_schema/examples/alibaba-call.json

      - name: diagnosis
        run: python -m unittest discover -s diagnosis/tests -t .

      - name: ingest
        working-directory: ingest
        run: python -m unittest discover -s tests -t .

      - name: reconstruction
        working-directory: reconstruction
        run: python -m unittest discover -s tests -t .

      - name: dashboard (unit, PostgreSQL and browser tests)
        working-directory: dashboard
        run: python -m unittest discover -s tests -t .

      - name: experiments
        run: python -m unittest discover -s experiments/tests -t .
